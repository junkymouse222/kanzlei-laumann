# /etc/nginx/sites-available/spedition-hausmann
# Reverse-Proxy auf den Node-Prozess. Nach DNS-Umstellung auf 38.60.136.33
# kann via certbot TLS für spedition-hausmann.de ergänzt werden.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name spedition-hausmann.de www.spedition-hausmann.de _;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
