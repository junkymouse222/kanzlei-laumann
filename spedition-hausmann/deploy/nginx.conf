# /etc/nginx/sites-available/spedition-hausmann
# Reverse-Proxy auf den Node-Prozess, nur HTTP.
# Sobald DNS auf diesen Server zeigt:
#   certbot --nginx -d spedition-hausmann.de -d www.spedition-hausmann.de --redirect
# deploy.sh überschreibt diese Datei nicht mehr, wenn das Zertifikat liegt.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name spedition-hausmann.de www.spedition-hausmann.de _;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
